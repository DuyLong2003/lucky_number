version: "3"
services:
  # The Application
  tatnientwd_bfd_vn:
    container_name: tatnientwd_bfd_vn
    build:
      context: ./
      dockerfile: Dockerfile
    restart: always
    networks:
      - traefik_traefik
    working_dir: /var/www
    # working_dir: /usr/src/app/build
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tatnientwd_bfd_vn.entrypoints=http"
      - "traefik.http.routers.tatnientwd_bfd_vn.rule=Host(`tatnientwd.bfd.vn`)"
      # - "traefik.http.routers.tatnientwd_bfd_vn.rule=Host(`localhost:3000`)"
      - "traefik.docker.network=traefik_traefik"
      - "traefik.http.services.tatnientwd_bfd_vn.loadbalancer.server.port=80"

      - "traefik.http.middlewares.tatnientwd_bfd_vn-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.tatnientwd_bfd_vn-https-redirect.redirectscheme.permanent=true"
      - "traefik.http.routers.tatnientwd_bfd_vn.middlewares=tatnientwd_bfd_vn-https-redirect"
      - "traefik.http.routers.tatnientwd_bfd_vn-secure.rule=Host(`tatnientwd.bfd.vn`)"
      # - "traefik.http.routers.tatnientwd_bfd_vn-secure.rule=Host(`localhost:3000`)"
      - "traefik.http.routers.tatnientwd_bfd_vn-secure.tls=true"
      - "traefik.http.routers.tatnientwd_bfd_vn-secure.tls.certresolver=http"
      - "traefik.http.routers.tatnientwd_bfd_vn-secure.entrypoints=https"
      - "traefik.http.routers.tatnientwd_bfd_vn-secure.service=tatnientwd_bfd_vn"

networks:
  traefik_traefik:
    external: true
